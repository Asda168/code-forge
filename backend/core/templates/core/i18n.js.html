  const wrap = (s, t) => s.match(/^\s*/)[0] + t + s.match(/\s*$/)[0];

  const SKIP = /^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT|CODE|KBD|PRE)$/;

    const p = n.parentNode; if (!p || SKIP.test(p.nodeName) || p.closest?.(".cmd")) return;

    KEEP.clear();

  const TITLE_EN = document.title, TITLE_KM = "Asta IDE — IDE ស្រាលសម្រាប់ Laravel, Python និងគេហទំព័រទំនើប";
