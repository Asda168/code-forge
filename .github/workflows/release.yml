name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64 --arm64
          - os: macos-latest
            args: --mac --universal
          - os: ubuntu-latest
            args: --linux AppImage deb rpm pacman
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot libarchive-tools
      - run: python -m pip install setuptools
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - name: Unit tests (path/command safety)
        run: node scripts/security-test.js
      # node-pty has no prebuilt Linux binaries, so rebuild native modules on Linux/macOS.
      # Code signing is opt-in: with the secrets below set, installers are signed (Windows) / signed + notarized (macOS),
      # which removes the SmartScreen / Gatekeeper warnings. Without them the build is unsigned, exactly as before.
      # See docs/SIGNING.md.
      - name: Build (Windows keeps node-pty prebuilds)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Option A: PFX (OV/EV) certificate.  Option B (recommended): Azure Trusted Signing. See docs/SIGNING.md.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          # Must equal the certificate subject (the validated organisation/individual name).
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        # One arch per run: a combined x64+arm64 build emits a tiny stub per-arch installer.
        run: |
          if (-not $env:CSC_LINK) { Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }
          $sign = @()
          if ($env:AZURE_ACCOUNT -and $env:AZURE_CLIENT_SECRET) {
            if (-not $env:WIN_PUBLISHER_NAME) { throw 'Signing is configured but the WIN_PUBLISHER_NAME variable is empty. Set it to the certificate subject name.' }
            $sign = @('-c.win.signAndEditExecutable=true', '-c.forceCodeSigning=true', "-c.win.azureSignOptions.publisherName=$env:WIN_PUBLISHER_NAME",
              "-c.win.azureSignOptions.endpoint=$env:AZURE_ENDPOINT", "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_PROFILE",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_ACCOUNT")
            Write-Host 'Signing Windows binaries with Azure Trusted Signing'
          } elseif ($env:CSC_LINK) {
            if (-not $env:WIN_PUBLISHER_NAME) { throw 'Signing is configured but the WIN_PUBLISHER_NAME variable is empty. Set it to the certificate subject name.' }
            $sign = @('-c.win.signAndEditExecutable=true', '-c.forceCodeSigning=true', "-c.win.signtoolOptions.publisherName=$env:WIN_PUBLISHER_NAME")
            Write-Host 'Signing Windows binaries with the PFX certificate'
          } else { Write-Warning 'No signing configured: building UNSIGNED. Windows Smart App Control / SmartScreen will block it until a certificate is added (docs/SIGNING.md).' }
          npx electron-builder --win --x64 --publish never @sign
          if ($LASTEXITCODE) { throw "electron-builder x64 failed (exit $LASTEXITCODE). If signing: check the secrets, the certificate profile and that the timestamp server is reachable." }
          npx electron-builder --win --arm64 --publish never @sign
          if ($LASTEXITCODE) { throw "electron-builder arm64 failed (exit $LASTEXITCODE)." }
      - name: Verify Windows signatures (before publishing)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Hashtable splatting passes real NAMED parameters (an array would be passed positionally, making the string '-Path' the path).
          $verify = @{ Path = 'dist' }
          if ($env:WIN_PUBLISHER_NAME) { $verify.Publisher = $env:WIN_PUBLISHER_NAME }
          if ($env:IS_RELEASE -eq 'true' -and $env:WIN_PUBLISHER_NAME) { $verify.Require = $true }   # strict only for releases with signing configured
          ./scripts/verify-signatures.ps1 @verify
      - name: Binary audit + SHA-256 manifest (win-unpacked)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          # Read-only report: per-file publisher/status/issuer/SHA-256/origin, plus a manifest to detect later modification.
          foreach ($d in 'win-unpacked', 'win-arm64-unpacked') {
            if (Test-Path "dist/$d") { ./scripts/audit-binaries.ps1 -Path "dist/$d" -Out "audit/$d" -Publisher $env:WIN_PUBLISHER_NAME }
          }
          Get-ChildItem dist/Asta-Setup-*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content audit/installers.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: signature-audit
          path: desktop/audit
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty CSC_LINK is read by electron-builder as a path (the project dir) and breaks the build, so unset it.
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          extra=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "${CSC_LINK:-}" ]; then
            extra="-c.mac.hardenedRuntime=true -c.mac.entitlements=scripts/entitlements.mac.plist -c.mac.entitlementsInherit=scripts/entitlements.mac.plist"
            [ -n "$APPLE_ID" ] && extra="$extra -c.mac.notarize=true"
          fi
          npx electron-builder ${{ matrix.args }} -c.npmRebuild=true --publish never $extra
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            !desktop/dist/Asta-Setup.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.pacman
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: SHA-256 checksums
        working-directory: artifacts
        run: sha256sum Asta* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  # Smoke tests: really install the built packages and check the app starts and stays up.
  # Not required by `release` (so a flaky runner can't block a release); check them before announcing a version.
  test-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-ubuntu-latest, path: pkg }
      - name: Install .deb
        run: sudo apt-get update && sudo apt-get install -y ./pkg/Asta.deb xvfb
      - name: .deb installs files and launcher
        run: |
          test -x /opt/Asta/codeforge
          test -f /usr/share/applications/codeforge.desktop
          find /opt/Asta -name pty.node | grep build/Release
      - name: .deb app starts and stays running
        run: |
          xvfb-run -a /opt/Asta/codeforge --no-sandbox > app.log 2>&1 &
          sleep 20
          pgrep -f /opt/Asta/codeforge || { cat app.log; echo "app exited"; exit 1; }
          pkill -f /opt/Asta/codeforge || true
      - name: AppImage starts and stays running
        run: |
          chmod +x pkg/Asta.AppImage
          xvfb-run -a ./pkg/Asta.AppImage --appimage-extract-and-run --no-sandbox > appimage.log 2>&1 &
          sleep 25
          pgrep -f 'Asta|codeforge' || { cat appimage.log; echo "AppImage exited"; exit 1; }
          pkill -f 'Asta|codeforge' || true
      - name: .rpm is valid
        run: |
          sudo apt-get install -y rpm
          rpm -qip pkg/Asta.rpm
      - name: .pacman (Arch Linux) is valid
        run: |
          sudo apt-get install -y libarchive-tools
          bsdtar -tf pkg/Asta.pacman | grep -q '^\.PKGINFO$'
          bsdtar -xOf pkg/Asta.pacman .PKGINFO

  test-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-macos-latest, path: pkg }
      - name: Mount dmg and copy app
        run: |
          hdiutil attach pkg/Asta-macOS-universal.dmg -nobrowse -mountpoint /Volumes/cc
          ls /Volumes/cc
          cp -R /Volumes/cc/Asta.app /Applications/
          hdiutil detach /Volumes/cc
          lipo -archs /Applications/Asta.app/Contents/MacOS/Asta
      - name: App starts and stays running
        run: |
          /Applications/Asta.app/Contents/MacOS/Asta > app.log 2>&1 &
          sleep 20
          pgrep -f Asta.app || { cat app.log; echo "app exited"; exit 1; }
          pkill -f Asta.app || true

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-windows-latest, path: pkg }
      - name: Clean install
        shell: pwsh
        run: |
          Start-Process pkg\Asta-Setup-x64.exe -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Asta\Asta.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
      - name: Installed binaries are signed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:LOCALAPPDATA\Programs\Asta\Asta.exe"
          Write-Host "$($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Warning "Asta.exe is not validly signed ($($sig.Status)); Smart App Control will block it."
          }
      - name: App starts and stays running
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\Asta\Asta.exe"
          Start-Sleep 15
          if (-not (Get-Process Asta -ErrorAction SilentlyContinue)) { throw "app exited" }
      - name: Upgrade while Asta is running (no manual close)
        shell: pwsh
        run: |
          $p = Start-Process pkg\Asta-Setup-x64.exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "installer hung (cannot close running app)" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Asta\Asta.exe")) { throw "app missing after upgrade" }
      - name: Uninstall
        shell: pwsh
        run: |
          Get-Process Asta -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process "$env:LOCALAPPDATA\Programs\Asta\Uninstall Asta.exe" -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Test-Path "$env:LOCALAPPDATA\Programs\Asta\Asta.exe") { throw 'uninstall left Asta.exe behind' }
      - name: Code Integrity log (blocked binaries)
        if: always()
        shell: pwsh
        run: |
          # 3033/3077 = image blocked by code integrity / policy. Hosted runners do not enforce Smart App Control, so this is informational there.
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-CodeIntegrity/Operational'; Id=3033,3034,3077} -MaxEvents 20 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
